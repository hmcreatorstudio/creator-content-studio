<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Content Studio</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
      line-height: 1.6;
    }

    h1 {
      font-size: 42px;
    }

    input {
      width: 100%;
      max-width: 500px;
      padding: 14px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 14px 22px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    #result {
      margin-top: 25px;
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>Creator Content Studio</h1>

  <p>Generate video ideas, hooks, titles and scripts.</p>

  <label for="topic">Enter your topic:</label>
  <br><br>

  <input
    type="text"
    id="topic"
    placeholder="Example: YouTube Shorts SEO"
  >

  <br>

  <button id="generateBtn" onclick="generateContent()">
    Generate Content
  </button>

  <div id="status"></div>

  <div id="result"></div>

  <script>
    async function generateContent() {
      const topic = document.getElementById("topic").value.trim();
      const button = document.getElementById("generateBtn");
      const status = document.getElementById("status");
      const result = document.getElementById("result");

      if (!topic) {
        status.textContent = "Please enter a topic.";
        return;
      }

      button.disabled = true;
      status.textContent = "Generating...";
      result.textContent = "";

      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            topic: topic
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Something went wrong.");
        }

        status.textContent = "Done!";
        result.textContent = data.result;

      } catch (error) {
        status.textContent = "Error";
        result.textContent = error.message;
      }

      button.disabled = false;
    }
  </script>

</body>
</html>
